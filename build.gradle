plugins {
	id 'java'
	id 'application'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.knowm.xchart:xchart:3.8.8'
}

application {
	mainClass = 'com.example.page_replacement.algorithms.ExecutionTest'
}
